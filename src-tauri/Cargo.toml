[package]
name = "nova-client"
version = "0.3.0"
description = "A lightweight, cross-platform Minecraft Java launcher"
authors = ["Nova Client contributors"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-opener = "2"
crust_core = "1.0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
reqwest = { version = "0.13", features = ["json", "multipart", "query"] }
base64 = "0.23"